name: Allocator Bench
on:
  workflow_dispatch:
    inputs:
      reps:
        description: Measured repetitions per cell.
        default: "5"
      warmups:
        description: Discarded leading repetitions per cell.
        default: "1"
      workloads:
        description: Space-separated subset of "check scrape".
        default: check scrape
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.gen.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: gen
        run: python3 .github/scripts/allocator_bench_matrix.py

  bench:
    needs: matrix
    name: ${{ matrix.cell.label }}
    runs-on: ${{ matrix.cell.runner }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.cells) }}
    env:
      ALLOCATOR: ${{ matrix.cell.allocator }}
      TOKIO_MULTI_THREAD: ${{ matrix.cell.mt }}
      PLATFORM_LABEL: ${{ matrix.cell.platform }}
      ALLOC_ENVS: ${{ matrix.cell.alloc_envs }}
      WORKLOADS: ${{ inputs.workloads }}
      REPS: ${{ inputs.reps }}
      WARMUPS: ${{ inputs.warmups }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: ${{ !matrix.cell.alpine }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: beta
          cache: true
          cache-key: allocator-bench-${{ matrix.cell.runner }}-${{ matrix.cell.allocator }}-mt-${{ matrix.cell.mt }}
      - if: ${{ !matrix.cell.alpine && runner.os != 'Windows' }}
        shell: bash
        run: bash .github/scripts/allocator_bench_unix.sh
      - if: ${{ !matrix.cell.alpine && runner.os == 'Windows' }}
        shell: pwsh
        run: ./.github/scripts/allocator_bench_windows.ps1
      - if: ${{ matrix.cell.alpine }}
        shell: bash
        env:
          RUST_IMAGE: rust:alpine
        run: bash .github/scripts/allocator_bench_alpine.sh
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-${{ matrix.cell.platform }}-${{ matrix.cell.allocator }}-mt${{ matrix.cell.mt }}
          path: |
            bench-results.tsv
            bench-*.log
          if-no-files-found: warn
  aggregate:
    needs: bench
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          pattern: bench-*
      - run: python3 .github/scripts/allocator_bench_aggregate.py artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-all
          path: bench-all.tsv
          if-no-files-found: error
