name: Allocator Bench
on:
  workflow_dispatch:
    inputs:
      reps:
        description: Measured repetitions per cell.
        default: "5"
      warmups:
        description: Discarded leading repetitions per cell.
        default: "1"
      workloads:
        description: >-
          Space-separated subset of "check scrape tls". Only tls completes a TLS
          handshake, so only tls exercises aws-lc-sys and can tell the override
          features apart from a no-op.
        default: check scrape tls
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  matrix:
    runs-on: ubuntu-26.04
    outputs:
      cells: ${{ steps.gen.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: gen
        run: python3 .github/scripts/allocator_bench_matrix.py

  bench:
    needs: matrix
    name: ${{ matrix.cell.label }}
    runs-on: ${{ matrix.cell.runner }}
    # jemalloc's manual warns that enabling background_thread through the conf
    # string can deadlock during initialization, and the `bg` cells are new.
    # With concurrency.cancel-in-progress false, one hung cell would hold the
    # next dispatch for the 6-hour default. 180 sits above a cold Alpine or
    # Windows-arm fat-LTO build, so it cannot fire on a healthy cell.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.cells) }}
    env:
      ALLOCATOR: ${{ matrix.cell.allocator }}
      TOKIO_MULTI_THREAD: ${{ matrix.cell.mt }}
      PLATFORM_LABEL: ${{ matrix.cell.platform }}
      ALLOC_ENVS: ${{ matrix.cell.alloc_envs }}
      WORKLOADS: ${{ inputs.workloads }}
      REPS: ${{ inputs.reps }}
      WARMUPS: ${{ inputs.warmups }}
      RUN_ID: ${{ github.run_id }}
      # renovate: datasource=pypi depName=cargo-zigbuild
      CARGO_ZIGBUILD_VERSION: 0.24.1
      # renovate: datasource=pypi depName=ziglang
      ZIG_VERSION: 0.17.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: ${{ matrix.cell.wrapper != 'alpine' }}
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: beta
          cache: true
          # One cache per runner instead of per cell: the cells differ only in
          # allocator features, so they share almost every dependency, and ~50
          # per-cell caches would push the CI caches out of the 10 GB quota.
          cache-shared-key: allocator-bench-${{ matrix.cell.runner }}
      - if: ${{ matrix.cell.wrapper == 'native' && runner.os != 'Windows' }}
        shell: bash
        run: bash .github/scripts/allocator_bench_unix.sh
      - if: ${{ matrix.cell.wrapper == 'native' && runner.os == 'Windows' }}
        shell: pwsh
        run: ./.github/scripts/allocator_bench_windows.ps1
      # The same cargo-zigbuild and zig as the release builds in ci.yml.
      - if: ${{ matrix.cell.wrapper == 'xenial' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - if: ${{ matrix.cell.wrapper == 'xenial' }}
        run: |
          uv tool install --exclude-newer '3 days' "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" --with "ziglang==${ZIG_VERSION}"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$(uv tool dir)/cargo-zigbuild/bin/python" >> "${GITHUB_ENV}"
      - if: ${{ matrix.cell.wrapper == 'xenial' }}
        shell: bash
        run: bash .github/scripts/allocator_bench_xenial.sh
      - if: ${{ matrix.cell.wrapper == 'alpine' }}
        shell: bash
        env:
          RUST_IMAGE: rust:alpine
        run: bash .github/scripts/allocator_bench_alpine.sh
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-${{ matrix.cell.platform }}-${{ matrix.cell.allocator }}-mt${{ matrix.cell.mt }}
          path: |
            bench-results.tsv
            bench-*.log
            bench-time-*.txt
            bench-tls-handshakes.txt
            bench-tls-server.err
          overwrite: true
          if-no-files-found: warn
  aggregate:
    needs: bench
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: bench-*
      - run: python3 .github/scripts/allocator_bench_aggregate.py artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-all
          path: bench-all.tsv
          overwrite: true
          if-no-files-found: error
