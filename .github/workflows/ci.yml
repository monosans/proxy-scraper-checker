name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build
      - clippy
      - pre-commit
      - rustfmt
      - udeps
    runs-on: ubuntu-26.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            cross: false
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            cross: false
            executable: proxy-scraper-checker.exe
          - target: i686-pc-windows-msvc
            runner: windows-2025
            cross: false
            executable: proxy-scraper-checker.exe
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            cross: false
            executable: proxy-scraper-checker.exe
          - target: aarch64-linux-android
            runner: ubuntu-26.04
            cross: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          # - target: aarch64-unknown-linux-gnu:centos
          #   runner: ubuntu-26.04
          #   cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04
            cross: true
          # - target: aarch64_be-unknown-linux-gnu
          #   runner: ubuntu-26.04
          #   cross: true
          - target: arm-linux-androideabi
            runner: ubuntu-26.04
            cross: true
          - target: arm-unknown-linux-gnueabi
            runner: ubuntu-26.04
            cross: true
          - target: arm-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            cross: true
          - target: arm-unknown-linux-musleabi
            runner: ubuntu-26.04
            cross: true
          - target: arm-unknown-linux-musleabihf
            runner: ubuntu-26.04
            cross: true
          - target: armv5te-unknown-linux-gnueabi
            runner: ubuntu-26.04
            cross: true
          - target: armv5te-unknown-linux-musleabi
            runner: ubuntu-26.04
            cross: true
          - target: armv7-linux-androideabi
            runner: ubuntu-26.04
            cross: true
          - target: armv7-unknown-linux-gnueabi
            runner: ubuntu-26.04
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            cross: true
          - target: armv7-unknown-linux-musleabi
            runner: ubuntu-26.04
            cross: true
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-26.04
            cross: true
          - target: i586-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: i586-unknown-linux-musl
            runner: ubuntu-26.04
            cross: true
          - target: i686-unknown-freebsd
            runner: ubuntu-26.04
            cross: true
          - target: i686-linux-android
            runner: ubuntu-26.04
            cross: true
          # - target: i686-pc-windows-gnu
          #   runner: ubuntu-26.04
          #   cross: true
          - target: i686-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: loongarch64-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: loongarch64-unknown-linux-musl
            runner: ubuntu-26.04
            cross: true
          # - target: mips-unknown-linux-gnu
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: mips-unknown-linux-musl
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: mips64-unknown-linux-gnuabi64
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: mips64-unknown-linux-muslabi64
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: mips64el-unknown-linux-gnuabi64
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: mips64el-unknown-linux-muslabi64
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: mipsel-unknown-linux-gnu
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: mipsel-unknown-linux-musl
          #   runner: ubuntu-26.04
          #   cross: true
          - target: powerpc-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: powerpc64-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: riscv64gc-unknown-linux-musl
            runner: ubuntu-26.04
            cross: true
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          - target: sparc64-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          # - target: sparcv9-sun-solaris
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: thumbv6m-none-eabi
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: thumbv7em-none-eabi
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: thumbv7em-none-eabihf
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: thumbv7m-none-eabi
          #   runner: ubuntu-26.04
          #   cross: true
          - target: thumbv7neon-linux-androideabi
            runner: ubuntu-26.04
            cross: true
          - target: thumbv7neon-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            cross: true
          # - target: thumbv8m.base-none-eabi
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: thumbv8m.main-none-eabi
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: thumbv8m.main-none-eabihf
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: wasm32-unknown-emscripten
          #   runner: ubuntu-26.04
          #   cross: true
          - target: x86_64-linux-android
            runner: ubuntu-26.04
            cross: true
          # - target: x86_64-pc-windows-gnu
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: x86_64-pc-solaris
          #   runner: ubuntu-26.04
          #   cross: true
          - target: x86_64-unknown-freebsd
            runner: ubuntu-26.04
            cross: true
          # - target: x86_64-unknown-dragonfly
          #   runner: ubuntu-26.04
          #   cross: true
          # - target: x86_64-unknown-illumos
          #   runner: ubuntu-26.04
          #   cross: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            cross: true
          # - target: x86_64-unknown-linux-gnu:centos
          #   runner: ubuntu-26.04
          #   cross: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            cross: true
          # - target: x86_64-unknown-netbsd
          #   runner: ubuntu-26.04
          #   cross: true
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - if: ${{ matrix.cross  }}
        run: cargo +beta install cross --git https://github.com/cross-rs/cross
        env:
          CARGO_BUILD_WARNINGS: allow
      - if: ${{ matrix.cross  }}
        run: cross +beta build --features tui --release --target '${{ matrix.target }}' --locked
      - if: ${{ !matrix.cross }}
        run: cargo +beta build --features tui --release --target '${{ matrix.target }}' --locked
      - run: mkdir dist
      - run: echo -n '${{ github.sha }}' > dist/commit-sha.txt
        shell: bash
      - run: mv config.toml dist/
      - run: mv LICENSE dist/
      - run: mv target/${{ matrix.target}}/release/${{ matrix.executable || 'proxy-scraper-checker' }} dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proxy-scraper-checker-binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  build-docker:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - platform: "linux/386"
            tag: "386"
            runner: ubuntu-26.04
          - platform: "linux/amd64"
            tag: "amd64"
            runner: ubuntu-26.04
          - platform: "linux/arm/v7"
            tag: "arm-v7"
            runner: ubuntu-26.04-arm
          - platform: "linux/arm64/v8"
            tag: "arm64-v8"
            runner: ubuntu-26.04-arm
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ github.sha }}-${{ matrix.tag }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: push
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
  upload-docker-manifest:
    needs:
      - build-docker
    runs-on: ubuntu-26.04
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          docker manifest create ghcr.io/${{ github.repository }}:${{ github.sha }}
          --amend ghcr.io/${{ github.repository }}:${{ github.sha }}-386
          --amend ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64
          --amend ghcr.io/${{ github.repository }}:${{ github.sha }}-arm-v7
          --amend ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64-v8
      - id: push
        shell: bash
        run: |
          digest=$(docker manifest push ghcr.io/${{ github.repository }}:${{ github.sha }} | tail -n 1)
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected output of docker manifest push: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
  upload-docker-prebuilt:
    needs:
      - upload-docker-manifest
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        platform:
          - "386"
          - "amd64"
          - "arm-v7"
          - "arm64-v8"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: mkdir -p dist
      - run: echo -n '${{ github.sha }}' > dist/commit-sha.txt
      - run: mv {out,compose.yaml,config.toml,LICENSE} dist/
      - name: Create Dockerfile
        run: |
          cat << 'EOF' > dist/Dockerfile
          # syntax=docker.io/docker/dockerfile:1

          FROM ghcr.io/${{ github.repository }}:${{ github.sha }}@${{ needs.upload-docker-manifest.outputs.digest }}

          ARG \
            UID=1000 \
            GID=1000

          USER root

          RUN (getent group "${GID}" || groupmod --gid "${GID}" app) \
            && usermod --uid "${UID}" --gid "${GID}" app

          USER app
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proxy-scraper-checker-docker-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
  upload-docker-src:
    needs:
      - build-docker
    strategy:
      matrix:
        platform:
          - "ppc64le"
          - "riscv64"
          - "s390x"
      fail-fast: false
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: mkdir -p dist
      - run: echo -n '${{ github.sha }}' > dist/commit-sha.txt
      - run: mv {out,src,Cargo.lock,Cargo.toml,compose.yaml,config.toml,Dockerfile,LICENSE} dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proxy-scraper-checker-docker-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
  release:
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build
      - upload-docker-prebuilt
      - upload-docker-src
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: download
        name: Download the archives
        shell: bash
        run: |
          head_sha=$(gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "${GITHUB_REF_NAME} has moved to ${head_sha}, leaving the release to its run"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir release
          gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("proxy-scraper-checker-")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api "repos/${GH_REPO}/actions/artifacts/${id}/zip" > "release/${name}.zip"
            done
          echo "publish=true" >> "${GITHUB_OUTPUT}"
      - id: attest
        if: ${{ steps.download.outputs.publish == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.zip
      - if: ${{ steps.download.outputs.publish == 'true' }}
        name: Publish the release and delete the previous ones
        shell: bash
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_RUN_ATTEMPT}" != 1 ]]; then
            tag+=".${GITHUB_RUN_ATTEMPT}"
          fi
          repo_url="${GITHUB_SERVER_URL}/${GH_REPO}"
          previous=$(gh release view --json tagName,targetCommitish --jq '"\(.tagName) \(.targetCommitish)"' || true)
          {
            echo "Built from ${GITHUB_SHA} in [workflow run ${GITHUB_RUN_ID}](${repo_url}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "Build provenance of every archive: ${ATTESTATION_URL} ([how to verify](${repo_url}#verifying-downloads))"
            if [[ -n "${previous}" ]]; then
              read -r previous_tag previous_sha <<< "${previous}"
              echo
              gh api --method POST "repos/${GH_REPO}/releases/generate-notes" \
                -f tag_name="${tag}" \
                -f target_commitish="${GITHUB_SHA}" \
                -f previous_tag_name="${previous_tag}" \
                --jq .body |
                sed '/^\*\*Full Changelog\*\*/d'
              # Previous tags get deleted, so compare commits instead.
              echo "**Full Changelog**: ${repo_url}/compare/${previous_sha}...${GITHUB_SHA}"
            fi
          } > notes.md
          gh release create "${tag}" release/*.zip \
            --target "${GITHUB_SHA}" \
            --title "$(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --latest \
            --notes-file notes.md

          gh release list --limit 1000 --json tagName --jq ".[] | select(.tagName != \"${tag}\") | .tagName" |
            while read -r old_tag; do
              gh release delete "${old_tag}" --cleanup-tag --yes
            done
  clippy:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - id: tui
            features: "--features tui"
            target: >
              aarch64-apple-darwin,
              aarch64-pc-windows-msvc,
              aarch64-unknown-linux-gnu,
              i686-pc-windows-msvc,
              x86_64-apple-darwin,
              x86_64-pc-windows-msvc,
              x86_64-unknown-linux-gnu,
              aarch64-linux-android,
              aarch64-unknown-linux-musl,
              arm-linux-androideabi,
              arm-unknown-linux-gnueabi,
              arm-unknown-linux-gnueabihf,
              arm-unknown-linux-musleabi,
              arm-unknown-linux-musleabihf,
              armv5te-unknown-linux-gnueabi,
              armv5te-unknown-linux-musleabi,
              armv7-linux-androideabi,
              armv7-unknown-linux-gnueabi,
              armv7-unknown-linux-gnueabihf,
              armv7-unknown-linux-musleabi,
              armv7-unknown-linux-musleabihf,
              i586-unknown-linux-gnu,
              i586-unknown-linux-musl,
              i686-unknown-freebsd,
              i686-linux-android,
              i686-unknown-linux-gnu,
              loongarch64-unknown-linux-gnu,
              loongarch64-unknown-linux-musl,
              powerpc-unknown-linux-gnu,
              powerpc64-unknown-linux-gnu,
              powerpc64le-unknown-linux-gnu,
              riscv64gc-unknown-linux-gnu,
              riscv64gc-unknown-linux-musl,
              s390x-unknown-linux-gnu,
              sparc64-unknown-linux-gnu,
              thumbv7neon-linux-androideabi,
              thumbv7neon-unknown-linux-gnueabihf,
              x86_64-linux-android,
              x86_64-unknown-freebsd,
              x86_64-unknown-illumos,
              x86_64-unknown-linux-musl
          - id: default
            features: ""
            target: >
              i686-unknown-linux-gnu,
              x86_64-unknown-linux-gnu,
              armv7-unknown-linux-gnueabihf,
              aarch64-unknown-linux-gnu,
              powerpc64le-unknown-linux-gnu,
              riscv64gc-unknown-linux-gnu,
              s390x-unknown-linux-gnu
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          target: ${{ matrix.target }}
          components: clippy
          cache-key: x86_64-unknown-linux-gnu-${{ matrix.id }}
      - run: cargo +beta clippy --all-targets ${{ matrix.features }} --
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uvx --no-cache prek run --all-files --show-diff-on-failure
  rustfmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          components: rustfmt
          cache-key: x86_64-unknown-linux-gnu
      - run: cargo +nightly fmt --check
  udeps:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - id: default
            features: ""
          - id: tui
            features: "--features tui"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          cache-key: x86_64-unknown-linux-gnu-${{ matrix.id }}
      - run: cargo +nightly install --locked cargo-udeps
      - run: cargo +nightly udeps ${{ matrix.features }}
