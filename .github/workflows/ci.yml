name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build
      - build-docker
      - clippy
      - coverage
      - licenses
      - pre-commit
      - rustfmt
      - test
      - udeps
    runs-on: ubuntu-26.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
  build:
    needs:
      - licenses
    env:
      # renovate: datasource=pypi depName=cargo-zigbuild
      CARGO_ZIGBUILD_VERSION: 0.24.0
      # renovate: datasource=pypi depName=ziglang
      ZIG_VERSION: 0.17.0
      RUST_TARGET: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            builder: cargo
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            builder: cargo
            executable: proxy-scraper-checker.exe
          - target: i686-pc-windows-msvc
            runner: windows-2025
            builder: cargo
            executable: proxy-scraper-checker.exe
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            builder: cargo
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            builder: cargo
            executable: proxy-scraper-checker.exe
          - target: aarch64-linux-android
            runner: ubuntu-26.04
            builder: cross
          - target: aarch64-unknown-freebsd
            runner: ubuntu-26.04
            builder: zigbuild
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          - target: arm-linux-androideabi
            runner: ubuntu-26.04
            builder: cross
          - target: arm-unknown-linux-gnueabi
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          - target: arm-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          - target: arm-unknown-linux-musleabi
            runner: ubuntu-26.04
            builder: zigbuild
          - target: arm-unknown-linux-musleabihf
            runner: ubuntu-26.04
            builder: zigbuild
          - target: armv5te-unknown-linux-gnueabi
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.23"
          - target: armv5te-unknown-linux-musleabi
            runner: ubuntu-26.04
            builder: zigbuild
          - target: armv7-linux-androideabi
            runner: ubuntu-26.04
            builder: cross
          - target: armv7-unknown-linux-gnueabi
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.27"
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          - target: armv7-unknown-linux-musleabi
            runner: ubuntu-26.04
            builder: zigbuild
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-26.04
            builder: zigbuild
          - target: i586-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          - target: i586-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          - target: i686-unknown-freebsd
            runner: ubuntu-26.04
            builder: zigbuild
          - target: i686-linux-android
            runner: ubuntu-26.04
            builder: cross
          - target: i686-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          - target: i686-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          - target: loongarch64-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.36"
          - target: loongarch64-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          # zig ships no glibc for 32-bit and big-endian 64-bit PowerPC.
          - target: powerpc-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: cross
          - target: powerpc64-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: cross
          - target: powerpc64-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          # aws-lc links against the IEEE 128-bit long double symbols that
          # glibc added in 2.32.
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.32"
          - target: powerpc64le-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          - target: riscv64a23-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.39"
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.29"
          - target: riscv64gc-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          # zig cc crashes compiling aws-lc for SPARC with optimizations on.
          - target: sparc64-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: cross
          - target: sparcv9-sun-solaris
            runner: ubuntu-26.04
            builder: cross
          - target: thumbv7neon-linux-androideabi
            runner: ubuntu-26.04
            builder: cross
          - target: thumbv7neon-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.23"
          - target: x86_64-linux-android
            runner: ubuntu-26.04
            builder: cross
          - target: x86_64-pc-solaris
            runner: ubuntu-26.04
            builder: cross
          - target: x86_64-unknown-freebsd
            runner: ubuntu-26.04
            builder: zigbuild
          - target: x86_64-unknown-illumos
            runner: ubuntu-26.04
            builder: cross
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            builder: zigbuild
            glibc: "2.17"
          # aws-lc does not build for the x32 ABI.
          # - target: x86_64-unknown-linux-gnux32
          #   runner: ubuntu-26.04
          #   builder: zigbuild
          #   glibc: "2.27"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            builder: zigbuild
          - target: x86_64-unknown-netbsd
            runner: ubuntu-26.04
            builder: cross
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          target: ${{ matrix.target }}
          cache: false
      # cross builds the targets that zig ships no libc for (Android, NetBSD,
      # Solaris, illumos) and those that zig or cargo-zigbuild fail on, as
      # commented in the matrix.
      - if: ${{ matrix.builder == 'cross' }}
        run: cargo +beta install cross --git https://github.com/cross-rs/cross --locked
        env:
          CARGO_BUILD_WARNINGS: allow
      - if: ${{ matrix.builder == 'cross' }}
        run: cross +beta build --features tui --release --target "${RUST_TARGET}" --locked
      - if: ${{ matrix.builder == 'zigbuild' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # zig comes from its official PyPI package. cargo-zigbuild runs it as
      # `python -m ziglang` with the Python of its own tool environment.
      - if: ${{ matrix.builder == 'zigbuild' }}
        run: |
          uv tool install "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" --with "ziglang==${ZIG_VERSION}"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$(uv tool dir)/cargo-zigbuild/bin/python" >> "${GITHUB_ENV}"
      # The .<version> suffix links the gnu targets against that glibc: the
      # oldest one Rust supports on the target, so the binaries also start on
      # old distributions.
      - if: ${{ matrix.builder == 'zigbuild' }}
        run: cargo +beta zigbuild --features tui --release --target "${RUST_TARGET}${GLIBC_SUFFIX}" --locked
        env:
          GLIBC_SUFFIX: ${{ matrix.glibc && format('.{0}', matrix.glibc) || '' }}
      - if: ${{ matrix.builder == 'cargo' }}
        run: cargo +beta build --features tui --release --target "${RUST_TARGET}" --locked
        shell: bash
      - run: mkdir dist
      - run: echo -n "${GITHUB_SHA}" > dist/commit-sha.txt
        shell: bash
      - run: mv config.toml dist/
      - run: mv config-schema.json dist/
      - run: mv LICENSE dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-licenses
      - run: mv LICENSE-THIRD-PARTY dist/
      - run: mv "target/${RUST_TARGET}/release/${EXECUTABLE}" dist/
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable || 'proxy-scraper-checker' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proxy-scraper-checker-binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  build-docker:
    needs:
      - licenses
    runs-on: ${{ matrix.runner }}
    permissions:
      artifact-metadata: write # record the attestation of the image
      attestations: write # attest the image
      id-token: write # sign the attestation
      packages: write # push the image to ghcr.io
    strategy:
      matrix:
        include:
          - platform: "linux/386"
            tag: "386"
            runner: ubuntu-26.04
          - platform: "linux/amd64"
            tag: "amd64"
            runner: ubuntu-26.04
          - platform: "linux/arm/v7"
            tag: "arm-v7"
            runner: ubuntu-26.04-arm
          - platform: "linux/arm64/v8"
            tag: "arm64-v8"
            runner: ubuntu-26.04-arm
          # The builder stage cross-compiles natively; QEMU only runs the few
          # RUN steps of the final stage.
          - platform: "linux/ppc64le"
            tag: "ppc64le"
            runner: ubuntu-26.04
            qemu: true
          - platform: "linux/riscv64"
            tag: "riscv64"
            runner: ubuntu-26.04
            qemu: true
          - platform: "linux/s390x"
            tag: "s390x"
            runner: ubuntu-26.04
            qemu: true
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-licenses
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ github.sha }}-${{ matrix.tag }}
      - if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: push
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
  upload-docker-manifest:
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build-docker
    runs-on: ubuntu-26.04
    permissions:
      artifact-metadata: write # record the attestation of the image
      attestations: write # attest the image
      id-token: write # sign the attestation
      packages: write # push the image to ghcr.io
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          docker manifest create "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
          --amend "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}-386"
          --amend "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}-amd64"
          --amend "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}-arm-v7"
          --amend "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}-arm64-v8"
          --amend "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}-ppc64le"
          --amend "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}-riscv64"
          --amend "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}-s390x"
      - id: push
        shell: bash
        run: |
          digest=$(docker manifest push "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" | tail -n 1)
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected output of docker manifest push: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
  upload-docker-prebuilt:
    needs:
      - licenses
      - upload-docker-manifest
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        platform:
          - "386"
          - "amd64"
          - "arm-v7"
          - "arm64-v8"
          - "ppc64le"
          - "riscv64"
          - "s390x"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: mkdir -p dist
      - run: echo -n "${GITHUB_SHA}" > dist/commit-sha.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-licenses
      - run: mv {out,compose.yaml,config.toml,config-schema.json,LICENSE,LICENSE-THIRD-PARTY} dist/
      - name: Create Dockerfile
        env:
          DIGEST: ${{ needs.upload-docker-manifest.outputs.digest }}
        run: |
          cat << EOF > dist/Dockerfile
          # syntax=docker.io/docker/dockerfile:1

          FROM ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}@${DIGEST}
          EOF
          cat << 'EOF' >> dist/Dockerfile

          ARG \
            UID=1000 \
            GID=1000

          USER root

          RUN groupmod --non-unique --gid "${GID}" app \
            && usermod --non-unique --uid "${UID}" app \
            && chown -R "${UID}:${GID}" /home/app

          USER app
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proxy-scraper-checker-docker-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
  release:
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build
      - upload-docker-prebuilt
    runs-on: ubuntu-26.04
    permissions:
      actions: read # download the artifacts of this run
      artifact-metadata: write # record the attestation of the archives
      attestations: write # attest the archives
      contents: write # publish the release and delete the previous ones
      id-token: write # sign the attestation
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: download
        name: Download the archives
        shell: bash
        run: |
          head_sha=$(gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "${GITHUB_REF_NAME} has moved to ${head_sha}, leaving the release to its run"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir release
          gh api --paginate "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("proxy-scraper-checker-")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api "repos/${GH_REPO}/actions/artifacts/${id}/zip" > "release/${name}.zip"
            done
          echo "publish=true" >> "${GITHUB_OUTPUT}"
      - id: attest
        if: ${{ steps.download.outputs.publish == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.zip
      - if: ${{ steps.download.outputs.publish == 'true' }}
        name: Publish the release and delete the previous ones
        shell: bash
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_RUN_ATTEMPT}" != 1 ]]; then
            tag+=".${GITHUB_RUN_ATTEMPT}"
          fi
          repo_url="${GITHUB_SERVER_URL}/${GH_REPO}"
          previous=$(gh release view --json tagName,targetCommitish --jq '"\(.tagName) \(.targetCommitish)"' || true)
          {
            echo "Built from ${GITHUB_SHA} in [workflow run ${GITHUB_RUN_ID}](${repo_url}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "Build provenance of every archive: ${ATTESTATION_URL} ([how to verify](${repo_url}#verifying-downloads))"
            if [[ -n "${previous}" ]]; then
              read -r previous_tag previous_sha <<< "${previous}"
              echo
              gh api --method POST "repos/${GH_REPO}/releases/generate-notes" \
                -f tag_name="${tag}" \
                -f target_commitish="${GITHUB_SHA}" \
                -f previous_tag_name="${previous_tag}" \
                --jq .body |
                sed '/^\*\*Full Changelog\*\*/d'
              # Previous tags get deleted, so compare commits instead.
              echo "**Full Changelog**: ${repo_url}/compare/${previous_sha}...${GITHUB_SHA}"
            fi
          } > notes.md
          gh release create "${tag}" release/*.zip \
            --target "${GITHUB_SHA}" \
            --title "$(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --latest \
            --notes-file notes.md

          gh release list --limit 1000 --json tagName --jq ".[] | select(.tagName != \"${tag}\") | .tagName" |
            while read -r old_tag; do
              gh release delete "${old_tag}" --cleanup-tag --yes
            done
  clippy:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - id: tui
            features: tui
          - id: default
            features: ""
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          components: clippy
          cache-key: x86_64-unknown-linux-gnu-${{ matrix.id }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +beta clippy --all-targets --features "${FEATURES}" --
        env:
          FEATURES: ${{ matrix.features }}
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          components: llvm-tools
          cache-key: coverage
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
          fallback: none
      # Each build leaves out code that only the other one has, so neither
      # covers everything alone.
      - run: cargo +beta llvm-cov --no-report --features "" --locked
      - run: cargo +beta llvm-cov --no-report --features tui --locked
      - run: cargo +beta llvm-cov report --fail-under-lines 100 --show-missing-lines
  licenses:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about
          fallback: none
      # Every artifact ships the licenses of the code it compiles in. The tui
      # feature is what the release binaries are built with; the Docker images
      # use a subset.
      - shell: bash
        run: cargo +beta about generate --fail --locked --features tui about.hbs | tr -d '\r' > LICENSE-THIRD-PARTY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: third-party-licenses
          path: LICENSE-THIRD-PARTY
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      # uvx and the hook environments prek installs read neither pyproject.toml
      # nor .npmrc, so their dependency cooldown is set here.
      - run: uvx --no-cache prek run --all-files --show-diff-on-failure
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: "3" # days
          UV_EXCLUDE_NEWER: 3 days
  rustfmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
      - run: cargo +nightly fmt --check
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - id: tui
            runner: ubuntu-26.04
            features: tui
          - id: default
            runner: ubuntu-26.04
            features: ""
          - id: macos
            runner: macos-26
            features: tui
          # Some of the output tests only exist on Windows.
          - id: windows
            runner: windows-2025
            features: tui
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          cache-key: test-${{ matrix.id }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +beta test --features "${FEATURES}" --locked
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
  udeps:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - id: default
            features: ""
          - id: tui
            features: tui
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-udeps
          fallback: none
      - run: cargo +nightly udeps --features "${FEATURES}"
        env:
          FEATURES: ${{ matrix.features }}
