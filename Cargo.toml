[package]
name = "proxy-scraper-checker"
version = "0.1.0"
edition = "2024"
description = "Scrapes HTTP, SOCKS4 and SOCKS5 proxies and keeps the ones that work"
repository = "https://github.com/monosans/proxy-scraper-checker"
license = "MIT"
publish = false

[dependencies]
async-trait = "=0.1.92"
color-eyre = "=0.6.5"
compact_str = { version = "=0.10.0", features = ["serde"] }
crossterm = { version = "=0.29.0", default-features = false, features = [
  "event-stream",
  "windows",
], optional = true }
dhat = { version = "=0.3.3", optional = true }
dirs = "=7.0.0"
fastrand = "=2.5.0"
futures = { version = "=0.3.34", default-features = false, features = [
  "std",
], optional = true }
http = "=1.5.0"
httpdate = "=1.0.3"
ipnet = "=2.12.2"
itoa = "=1.0.18"
log = { version = "=0.4.35", features = [
  "max_level_debug",
  "release_max_level_debug",
  "std",
] }
maxminddb = { version = "=0.32.0", features = ["mmap"] }
mimalloc = { version = "=0.1.52", optional = true }
parking_lot = "=0.13.0"
rapidhash = { version = "=4.5.1", features = ["unsafe"] }
ratatui = { version = "=0.30.2", default-features = false, features = [
  "crossterm",
  "layout-cache",
  "std",
], optional = true }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", features = ["brotli", "gzip", "socks"] }
reqwest-middleware = "=0.5.2"
rlimit = "=0.11.0"
rustls = { version = "=0.23.46", default-features = false, features = [
  "aws_lc_rs",
  "brotli",
  "prefer-post-quantum",
  "std",
  "tls12",
] }
serde = "=1.0.229"
serde_json = "=1.0.154"
tikv-jemallocator = { version = "=0.7.0", default-features = false, optional = true }
tokio = { version = "=1.54.1", features = [
  "fs",
  "macros",
  "parking_lot",
  "signal",
] }
tokio-util = "=0.7.20"
toml = { version = "=1.1.8", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
tracing = { version = "=0.1.44", default-features = false, features = [
  "max_level_debug",
  "release_max_level_debug",
  "std",
] }
tracing-subscriber = { version = "=0.3.23", features = ["parking_lot"] }
tui-logger = { version = "=0.18.3", features = [
  "tracing-support",
], optional = true }
unicode-segmentation = { version = "=1.13.3", optional = true }
unicode-width = { version = "=0.2.3", optional = true }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[target.'cfg(all(target_env = "musl", target_has_atomic = "64"))'.dependencies]
mimalloc-auto = { package = "mimalloc", version = "=0.1.52", features = [
  "no_thp",
  "override",
  "v2",
], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "=0.7.1"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "=1.0.11"

[target.'cfg(target_os = "macos")'.dependencies]
tikv-jemallocator-auto = { package = "tikv-jemallocator", version = "=0.7.0", default-features = false, features = [
  "override_allocator_on_supported_platforms",
], optional = true }

[features]
default = ["auto-allocator"]
__mimalloc = ["dep:mimalloc"]
auto-allocator = ["dep:mimalloc-auto", "dep:tikv-jemallocator-auto"]
dhat = ["dep:dhat"]
jemalloc = ["dep:tikv-jemallocator"]
jemalloc_override = [
  "jemalloc",
  "tikv-jemallocator/override_allocator_on_supported_platforms",
]
mimalloc_override = ["__mimalloc", "mimalloc/override"]
mimalloc_v2 = ["__mimalloc", "mimalloc/v2"]
mimalloc_v2_no_thp = ["mimalloc_v2", "mimalloc/no_thp"]
mimalloc_v3 = ["__mimalloc"]
mimalloc_v3_no_thp = ["mimalloc_v3", "mimalloc/no_thp"]
tokio-multi-thread = ["tokio/rt-multi-thread"]
tui = [
  "dep:crossterm",
  "dep:futures",
  "dep:ratatui",
  "dep:tui-logger",
  "dep:unicode-segmentation",
  "dep:unicode-width",
]

[lints.clippy]
absolute_paths = "allow"
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "allow"
arbitrary_source_item_ordering = "allow"
as_conversions = "allow"
blanket_clippy_restriction_lints = "allow"
cargo = { level = "deny", priority = -1 }
cast_precision_loss = "allow"
cognitive_complexity = "allow"
else_if_without_else = "allow"
float_arithmetic = "allow"
implicit_return = "allow"
integer_division_remainder_used = "allow"
iter_over_hash_type = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
mod_module_files = "allow"
multiple_crate_versions = "allow"
nursery = { level = "deny", priority = -1 }
pattern_type_mismatch = "allow"
pedantic = { level = "deny", priority = -1 }
question_mark_used = "allow"
restriction = { level = "deny", priority = -1 }
separated_literal_suffix = "allow"
shadow_reuse = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
too_many_lines = "allow"
unwrap_used = "allow"

[lints.rust]
ambiguous_negative_literals = "deny"
dead_code_pub_in_binary = "deny"
deprecated_in_future = "deny"
deprecated_safe = { level = "deny", priority = -1 }
deref_into_dyn_supertrait = "deny"
ffi_unwind_calls = "deny"
future_incompatible = { level = "deny", priority = -1 }
impl_trait_redundant_captures = "deny"
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_copy_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
nonstandard_style = { level = "deny", priority = -1 }
redundant_imports = "deny"
redundant_lifetimes = "deny"
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unsafe_code = "deny"
unstable_features = "deny"
unused = { level = "deny", priority = -1 }
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"
warnings = "deny"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[profile.dhat]
inherits = "release"
debug = true
strip = "none"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = "off"
