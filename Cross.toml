# cross links x86_64-unknown-netbsd against NetBSD 9.3, whose libc has no
# getentropy(3), which aws-lc calls. Swap in the NetBSD 10.0 sysroot (the
# release Rust's own NetBSD target is built for) until cross-rs/cross#1807 is
# in the image.
[target.x86_64-unknown-netbsd]
pre-build = [
  "apt-get update && apt-get install --assume-yes --no-install-recommends ca-certificates curl xz-utils",
  "mkdir /tmp/netbsd && for set in base comp; do curl -fsSL https://archive.netbsd.org/pub/NetBSD-archive/NetBSD-10.0/amd64/binary/sets/$set.tar.xz | tar -C /tmp/netbsd -xJf - ./usr/include ./usr/lib; done && curl -fsSL https://archive.netbsd.org/pub/NetBSD-archive/NetBSD-10.0/amd64/binary/sets/base.tar.xz | tar -C /tmp/netbsd -xJf - ./lib",
  "cd /usr/local/x86_64-unknown-netbsd && rm -rf include && cp -r /tmp/netbsd/usr/include . && cd lib && rm -f libc.so* libm.so* && cp /tmp/netbsd/lib/libc.so.12.220 /tmp/netbsd/lib/libm.so.0.13 /tmp/netbsd/lib/libutil.so.7.24 /tmp/netbsd/lib/libpthread.so.1.4 /tmp/netbsd/usr/lib/librt.so.1.1 /tmp/netbsd/usr/lib/libexecinfo.so /tmp/netbsd/usr/lib/libc.a /tmp/netbsd/usr/lib/libc_p.a /tmp/netbsd/usr/lib/libm.a /tmp/netbsd/usr/lib/libm_p.a /tmp/netbsd/usr/lib/libpthread.a /tmp/netbsd/usr/lib/libpthread_p.a /tmp/netbsd/usr/lib/crt0.o /tmp/netbsd/usr/lib/crti.o /tmp/netbsd/usr/lib/crtn.o /tmp/netbsd/usr/lib/crtbegin.o /tmp/netbsd/usr/lib/crtbeginS.o /tmp/netbsd/usr/lib/crtend.o /tmp/netbsd/usr/lib/crtendS.o /tmp/netbsd/usr/lib/gcrt0.o . && ln -s libc.so.12.220 libc.so && ln -s libc.so.12.220 libc.so.12 && ln -s libm.so.0.13 libm.so && ln -s libm.so.0.13 libm.so.0 && rm -rf /tmp/netbsd",
]
