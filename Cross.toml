# cross has no images for the MIPS musl targets, rust-musl-cross does. Their
# nightly is too old for this crate and cannot be updated in place, so
# install a fresh one and give it, like the image's build-std.sh does, the C
# runtime objects for self-contained linking and libgcc as libunwind.

[target.mips64-unknown-linux-muslabi64]
image = "ghcr.io/rust-cross/rust-musl-cross:mips64-muslabi64"
pre-build = [
  "rustup toolchain uninstall nightly",
  "rustup toolchain install nightly --profile minimal --component rust-src",
  'sc="$(rustc +nightly --print sysroot)/lib/rustlib/$RUST_MUSL_CROSS_TARGET/lib/self-contained" && gcc="$(ls -d /usr/local/musl/lib/gcc/$RUST_MUSL_CROSS_TARGET/*/ | sort -V | tail -n 1)" && mkdir -p "$sc" && cp /usr/local/musl/$RUST_MUSL_CROSS_TARGET/lib/*.o "$gcc"c*.o "$sc"/ && cp "$gcc"libgcc.a "$sc"/libunwind.a',
]
env.passthrough = ["CARGO_TARGET_MIPS64_UNKNOWN_LINUX_MUSLABI64_LINKER=mips64-unknown-linux-muslabi64-gcc"]

[target.mips64el-unknown-linux-muslabi64]
image = "ghcr.io/rust-cross/rust-musl-cross:mips64el-muslabi64"
pre-build = [
  "rustup toolchain uninstall nightly",
  "rustup toolchain install nightly --profile minimal --component rust-src",
  'sc="$(rustc +nightly --print sysroot)/lib/rustlib/$RUST_MUSL_CROSS_TARGET/lib/self-contained" && gcc="$(ls -d /usr/local/musl/lib/gcc/$RUST_MUSL_CROSS_TARGET/*/ | sort -V | tail -n 1)" && mkdir -p "$sc" && cp /usr/local/musl/$RUST_MUSL_CROSS_TARGET/lib/*.o "$gcc"c*.o "$sc"/ && cp "$gcc"libgcc.a "$sc"/libunwind.a',
]
env.passthrough = ["CARGO_TARGET_MIPS64EL_UNKNOWN_LINUX_MUSLABI64_LINKER=mips64el-unknown-linux-muslabi64-gcc"]
