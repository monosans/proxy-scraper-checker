# cross builds its Android images for API level 28 (Android 9), but Rust's
# Android targets support API level 21 (Android 5). Point the image's compiler
# wrappers at API level 21 so the binaries also run on older devices. Once
# cross-rs/cross#1809 is in the images, CROSS_ANDROID_SDK alone does this.
[target.aarch64-linux-android]
pre-build = ["sed -i -E 's/(android(eabi)?)28/\\121/' /android-ndk/bin/*-gcc /android-ndk/bin/*-g++"]
env.passthrough = ["CROSS_ANDROID_SDK=21"]

[target.arm-linux-androideabi]
pre-build = ["sed -i -E 's/(android(eabi)?)28/\\121/' /android-ndk/bin/*-gcc /android-ndk/bin/*-g++"]
env.passthrough = ["CROSS_ANDROID_SDK=21"]

[target.armv7-linux-androideabi]
pre-build = ["sed -i -E 's/(android(eabi)?)28/\\121/' /android-ndk/bin/*-gcc /android-ndk/bin/*-g++"]
env.passthrough = ["CROSS_ANDROID_SDK=21"]

[target.i686-linux-android]
pre-build = ["sed -i -E 's/(android(eabi)?)28/\\121/' /android-ndk/bin/*-gcc /android-ndk/bin/*-g++"]
env.passthrough = ["CROSS_ANDROID_SDK=21"]

[target.thumbv7neon-linux-androideabi]
pre-build = ["sed -i -E 's/(android(eabi)?)28/\\121/' /android-ndk/bin/*-gcc /android-ndk/bin/*-g++"]
env.passthrough = ["CROSS_ANDROID_SDK=21"]

[target.x86_64-linux-android]
pre-build = ["sed -i -E 's/(android(eabi)?)28/\\121/' /android-ndk/bin/*-gcc /android-ndk/bin/*-g++"]
env.passthrough = ["CROSS_ANDROID_SDK=21"]

# cross links the Solaris targets against DilOS libraries standing in for
# Solaris 10, but Rust's Solaris targets are built for Solaris 11.4. Swap in the
# Solaris 11.4 sysroot that Rust's own CI uses and regenerate GCC's fixed
# headers from it.
[target.sparcv9-sun-solaris]
pre-build = [
  "curl -fsSL -o /tmp/sysroot.tar.bz2 https://ci-mirrors.rust-lang.org/rustc/solaris-11.4.42.111.0-sparc-sysroot-v2025-02-21.tar.bz2 && echo 'e249a7ef781b9b3297419bd014fa0574800703981d84e113d6af3a897a8b4ffc  /tmp/sysroot.tar.bz2' | sha256sum -c && mkdir /tmp/solaris && tar -C /tmp/solaris -xjf /tmp/sysroot.tar.bz2",
  "cd /usr/local/sparcv9-sun-solaris2.10 && rm -rf usr/include lib/*.so* lib/*.o && cp -r /tmp/solaris/usr/include usr/ && cp -P /tmp/solaris/lib/sparcv9/* /tmp/solaris/usr/lib/sparcv9/*.o /tmp/solaris/usr/lib/sparcv9/liblgrp.so* lib/ && /usr/local/libexec/gcc/sparcv9-sun-solaris2.10/8.4.0/install-tools/mkheaders && rm -rf /tmp/solaris /tmp/sysroot.tar.bz2",
]

[target.x86_64-pc-solaris]
pre-build = [
  "curl -fsSL -o /tmp/sysroot.tar.bz2 https://ci-mirrors.rust-lang.org/rustc/solaris-11.4.42.111.0-i386-sysroot-v2025-02-21.tar.bz2 && echo 'e82b78c14464cc2dc71f3cdab312df3dd63441d7c23eeeaf34d41d8b947688d3  /tmp/sysroot.tar.bz2' | sha256sum -c && mkdir /tmp/solaris && tar -C /tmp/solaris -xjf /tmp/sysroot.tar.bz2",
  "cd /usr/local/x86_64-pc-solaris2.10 && rm -rf usr/include lib/*.so* lib/*.o && cp -r /tmp/solaris/usr/include usr/ && cp -P /tmp/solaris/lib/amd64/* /tmp/solaris/usr/lib/amd64/*.o /tmp/solaris/usr/lib/amd64/liblgrp.so* lib/ && /usr/local/libexec/gcc/x86_64-pc-solaris2.10/8.4.0/install-tools/mkheaders && rm -rf /tmp/solaris /tmp/sysroot.tar.bz2",
]
