# The targets CI builds binaries for. The Docker images are built for some of
# the linux-gnu ones.
targets = [
  "aarch64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-freebsd",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "arm-linux-androideabi",
  "arm-unknown-linux-gnueabi",
  "arm-unknown-linux-gnueabihf",
  "arm-unknown-linux-musleabi",
  "arm-unknown-linux-musleabihf",
  "armv5te-unknown-linux-gnueabi",
  "armv5te-unknown-linux-musleabi",
  "armv7-linux-androideabi",
  "armv7-unknown-linux-gnueabi",
  "armv7-unknown-linux-gnueabihf",
  "armv7-unknown-linux-musleabi",
  "armv7-unknown-linux-musleabihf",
  "i586-unknown-linux-gnu",
  "i586-unknown-linux-musl",
  "i686-linux-android",
  "i686-pc-windows-msvc",
  "i686-unknown-freebsd",
  "i686-unknown-linux-gnu",
  "i686-unknown-linux-musl",
  "loongarch64-unknown-linux-gnu",
  "loongarch64-unknown-linux-musl",
  "powerpc-unknown-linux-gnu",
  "powerpc64-unknown-linux-gnu",
  "powerpc64-unknown-linux-musl",
  "powerpc64le-unknown-linux-gnu",
  "powerpc64le-unknown-linux-musl",
  "riscv64a23-unknown-linux-gnu",
  "riscv64gc-unknown-linux-gnu",
  "riscv64gc-unknown-linux-musl",
  "s390x-unknown-linux-gnu",
  "sparc64-unknown-linux-gnu",
  "sparcv9-sun-solaris",
  "thumbv7neon-linux-androideabi",
  "thumbv7neon-unknown-linux-gnueabihf",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-pc-solaris",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-illumos",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-netbsd",
]
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

# aws-lc-sys bundles the AWS-LC C library. Its LICENSE lists the copyright
# notices of everything compiled in, followed by the full texts of the licenses.
# Take the notices with the Apache-2.0 text, the ISC and BSD-3-Clause texts on
# their own, and the MIT text from the bundled fiat-crypto with its notice.
[aws-lc-sys.clarify]
license = "Apache-2.0 AND ISC AND MIT AND BSD-3-Clause"

