services:
  samply:
    build:
      context: ../..
      dockerfile: bench/samply/Dockerfile
      pull: true
    init: true
    privileged: true
    volumes:
      # Keeps the IP databases between recordings. The first run, and one after a
      # database update, still downloads them inside the recording.
      - proxy_scraper_checker_cache:/root/.cache/proxy_scraper_checker
      - ../../out:/app/out
      - ../../config.toml:/app/config.toml:ro
volumes:
  proxy_scraper_checker_cache:
