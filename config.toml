  "https://raw.githubusercontent.com/ebrasha/abdal-proxy-hub/refs/heads/main/https-proxy-list-by-EbraSha.txt",
  "https://raw.githubusercontent.com/hproxy-com/free-proxy-list/refs/heads/main/http.txt",
